version: "3.9"
services:
  web:
    build:
      context: ./starter-template
      dockerfile: ../Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./starter-template:/app:cached
      - /app/node_modules
      - /app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
